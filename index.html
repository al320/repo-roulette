<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo Roulette</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 id="app-title">Repo Roulette</h1>
      <p class="app-tagline">Discover popular, active open-source repositories at random.</p>
    </header>

    <main id="main-content">
      <div class="action-group">
        <button type="button" id="randomize-btn" class="randomize-button">
          Randomize
        </button>
      </div>

      <section
        id="status-region"
        class="status-region"
        aria-live="polite"
        aria-atomic="true"
        role="status"
      ></section>

      <section id="result-section" class="result-section" aria-label="Repository Result">
        <div id="result-container" class="result-container">
          <p class="empty-state-message">Ready to discover something?</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
