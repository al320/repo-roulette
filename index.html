<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repo Roulette</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 id="app-title">Repo Roulette</h1>
      <p class="app-tagline">Discover popular, active open-source repositories at random.</p>
    </header>

    <main id="main-content">
      <div class="filters-container">
        <div class="filter-group">
          <label for="min-stars" class="filter-label">Minimum Stars</label>
          <input
            type="number"
            id="min-stars"
            name="min-stars"
            class="filter-input"
            value="500"
            min="0"
            step="1"
          >
        </div>

        <div class="filter-group">
          <label for="max-stars" class="filter-label">Maximum Stars</label>
          <input
            type="number"
            id="max-stars"
            name="max-stars"
            class="filter-input"
            value="100000"
            min="0"
            step="1"
          >
        </div>

        <div class="filter-group">
          <label for="language-select" class="filter-label">Programming Language</label>
          <select id="language-select" name="language" class="filter-select">
            <option value="">All Languages</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
          </select>
        </div>
      </div>

      <div class="action-group">
        <button type="button" id="randomize-btn" class="randomize-button">
          Randomize
        </button>
      </div>

      <section
        id="status-region"
        class="status-region"
        aria-live="polite"
        aria-atomic="true"
        role="status"
      ></section>

      <section id="result-section" class="result-section" aria-label="Repository Result">
        <div id="result-container" class="result-container">
          <p class="empty-state-message">Ready to discover something?</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
